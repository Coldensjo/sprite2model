# On a version tag (v0.1.0), builds the command line for Windows, Linux and macOS and attaches it to
# the tag's release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=sprite2model-${GITHUB_REF_NAME}-${os}-${arch}
            ext=""; [ "$os" = windows ] && ext=.exe
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "build/$name/sprite2model$ext" ./cmd/sprite2model
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "sprite2model $GITHUB_REF_NAME" --generate-notes
